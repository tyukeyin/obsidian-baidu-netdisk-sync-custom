name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

  workflow_dispatch:
    inputs:
      version:
        description: Exact existing release tag matching manifest version
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          node -e "const v=process.env.RELEASE_VERSION; if(v!==require('./manifest.json').version || v!==require('./package.json').version) { console.error('Release tag and package versions must match'); process.exit(1); }"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run unit tests
        run: |
          npm test
          npm run test:engine
          npm run test:content
          npm run test:structure
          npm run test:scheduler
          npm run test:cloudListing
          npm run test:listing
          npm run typecheck

      - name: Build plugin bundle
        run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: ${{ inputs.version || github.ref_name }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
